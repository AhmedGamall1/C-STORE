x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cstore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: cstore_redis
    restart: unless-stopped
    command: redis-server --maxmemory 48mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    logging: *logging

  server:
    image: ghcr.io/ahmedgamall1/cstore-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: cstore_server
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '-qO-', '--tries=1', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 320m
    logging: *logging

  web:
    image: ghcr.io/ahmedgamall1/cstore-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: cstore_web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    networks:
      default:
      edge:
        aliases:
          - cstore-web
    mem_limit: 64m
    logging: *logging

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
    external: true
