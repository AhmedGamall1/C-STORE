name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/deploy.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/deploy.yml']

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cstore_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d cstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/cstore_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare test env
        run: cp .env.test.example .env.test

      - name: Generate Prisma client
        run: npm run db:generate -w apps/server

      - name: Lint server
        run: npm run lint -w apps/server

      - name: Typecheck
        run: |
          npm run typecheck -w apps/server
          npm run typecheck -w apps/client

      - name: Tests
        run: npm test

  images:
    name: Images
    runs-on: ubuntu-24.04-arm
    needs: [test]
    permissions:
      contents: read
      packages: write

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/ahmedgamall1/cstore-server:${{ github.sha }}
            ghcr.io/ahmedgamall1/cstore-server:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server-arm64
          cache-to: type=gha,mode=max,scope=server-arm64

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/ahmedgamall1/cstore-web:${{ github.sha }}
            ghcr.io/ahmedgamall1/cstore-web:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,mode=max,scope=web-arm64
